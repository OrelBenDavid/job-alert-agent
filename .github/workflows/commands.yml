# workflow זה אחראי על טיפול בפקודות שאתה שולח לבוט בטלגרם (/add, /list, /remove)
name: Process Telegram Commands

on:
  schedule:
    - cron: '*/10 * * * *'     # מריץ אוטומטית כל 10 דקות - כדי שהתגובה לפקודה תהיה מהירה יחסית
  workflow_dispatch:            # מאפשר גם הרצה ידנית לבדיקה

jobs:
  process:
    runs-on: ubuntu-latest       # מכונה וירטואלית זמנית של גיטהאב

    steps:
      - uses: actions/checkout@v4
        # שלב 1: מוריד את קוד הריפו, כולל companies.json ו-telegram_state.json הנוכחיים

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        # שלב 2: מתקין פייתון

      - run: pip install -r requirements.txt
        # שלב 3: מתקין את כל הספריות שהסקריפט צריך - requests, bs4 (לזיהוי אוטומטי) ו-anthropic (fallback ל-LLM)

      - run: python process_commands.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}    # אותו secret שמוגדר פעם אחת ברמת הריפו
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # אופציונלי - בלי זה, /add פשוט ידלג על שלב ה-LLM
        # שלב 4: קורא הודעות חדשות מטלגרם ומעדכן את companies.json בהתאם

      - name: Commit changes
        run: |
          git config user.name "job-bot"
          git config user.email "bot@users.noreply.github.com"
          git add companies.json telegram_state.json                        # שני הקבצים שיכולים להשתנות כאן
          git diff --staged --quiet || git commit -m "update companies via telegram"   # commit רק אם היה שינוי
          git push
        # שלב 5: שומר את הרשימה המעודכנת ואת ה-state של טלגרם בחזרה לריפו
