name: Check job postings

on:
  schedule:
    # Every 3 hours, UTC. Actual scheduling can be delayed 10-30 min - that's
    # normal, and it is not reliable for "exactly at X". See the project
    # discussion on the Actions minute budget.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # Manual run - for testing, and for responding to a
                          # Telegram command without waiting for the cron

concurrency:
  group: job-alert-check
  cancel-in-progress: false   # Never cancel a run mid state-write - better to
                               # make the new run wait

permissions:
  contents: write   # Required to commit state/ back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # Second line of defence against loops that don't
                           # terminate - MAX_PAGES in the code is not trusted alone

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # *** --with-deps was REMOVED on 2026-08-18. It is what killed a run. ***
      #
      # This step used to be `playwright install --with-deps chromium`, and
      # --with-deps runs a full `apt-get update` against four repositories on
      # EVERY run - the browser cache above does not cover apt packages, so a
      # cache hit did not prevent it. Measured across 20 consecutive runs it
      # cost 12-22s normally, 6m 46s once, and on 2026-08-18T01:41 it hung for
      # the full 20 minutes and the job was killed. That run fetched nothing:
      # "Run check" never started, and because a killed job never reaches the
      # commit step below, the whole run was lost.
      #
      # What --with-deps actually installed, from a successful run's log:
      # "0 upgraded, 9 newly installed" - and all 9 are FONTS (fonts-unifont,
      # fonts-ipafont-gothic, fonts-wqy-zenhei, xfonts-cyrillic and friends).
      # Every shared library Chromium needs - libnss3, libgbm1, libatk,
      # libcups2, libdrm2 - is already "the newest version" on the
      # ubuntu-latest image.
      #
      # Fonts do not affect this bot, because it never renders anything: the
      # fetcher reads the DOM with inner_text() and takes no screenshots, so a
      # missing glyph cannot change a job title, a location or a selector
      # match. Dropping them removes the apt round-trip entirely.
      #
      # If a future runner image ever does drop a real library, the symptom is
      # a Chromium launch failure on the one playwright company, which surfaces
      # as an ordinary fetch failure and a maintenance alert after two runs -
      # not a silent wrong answer. The fix would be to put --with-deps back.
      - name: Install Playwright browser (chromium only)
        # Bounds the download on a cache MISS (~120 MB). On a hit this step is
        # a couple of seconds, so this can only ever fire on a genuinely stuck
        # download - which is exactly the case that used to eat the job.
        timeout-minutes: 5
        # A browser that fails to install must cost ONE company, not the run.
        # Without this, the job stops here and the 144 API companies - which
        # need no browser at all - are never fetched and never commit state.
        # With it, wix raises inside the fetch, is recorded as that company's
        # failure by the existing health gate, and everything else proceeds.
        continue-on-error: true
        run: python -m playwright install chromium

      - name: Run check
        working-directory: src
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Only the FETCH phase is concurrent - see fetchers.fetch_all.
          # Tuned to a GitHub-hosted runner, which is 2 vCPU / 7 GB on a
          # private repo (4 / 16 on a public one). The browser number is the
          # one that matters: each playwright company is a whole Chromium,
          # and oversubscribing does not just run slower, it pushes the
          # first-page selector wait past its budget and turns healthy
          # fetches into failures. Raise it only together with a runner size.
          JOB_ALERT_NETWORK_WORKERS: "12"
          JOB_ALERT_BROWSER_WORKERS: "2"
          # Time budgets, both sized against timeout-minutes above rather than
          # against anything in the code. A run killed by that timeout never
          # reaches the commit step below, so every state write it had already
          # made is discarded and the next run walks into the same wall.
          # Finishing early with some companies skipped is the better failure.
          JOB_ALERT_FETCH_BUDGET_SECONDS: "780"    # stop starting new fetches
          JOB_ALERT_COMPANY_BUDGET_SECONDS: "240"  # cap one company's page walk
          # *** JOB_ALERT_MAX_NEW_JOBS is deliberately NOT set here. ***
          #
          # It used to be "50", from the measured basis that a full run across
          # 141 companies returned ~1,350 Israel-relevant postings, so 50 new
          # ones in one 3-hour window was ~4% of the corpus turning over.
          #
          # The ratio was the finding. The integer was an artefact of the
          # corpus size that day, and pinning it here made the gate tighten by
          # itself every time a company was added: at ~2,100 postings it is
          # already ~2.4%, and at the scale this project is heading for it
          # would hold alerts on most runs. state.py now derives the threshold
          # from the corpus each run actually fetched, and setting this
          # variable overrides that - so it is left unset on purpose.
          #
          # Set it to a number only to PIN the threshold during an
          # investigation, and remove it again afterwards.
        run: python run.py

      - name: Commit updated state
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ profiles/
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          # Rebase before pushing: the concurrency group above stops two runs
          # overlapping, but nothing stops a human pushing during one. Losing
          # the push means losing the whole run's state, and every job it saw
          # is re-alerted next run.
          git pull --rebase --autostash
          git push
