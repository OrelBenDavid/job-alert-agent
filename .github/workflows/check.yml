name: Check job postings

on:
  schedule:
    # כל 3 שעות, UTC. תזמון בפועל עשוי להתעכב 10-30 דק' - זה תקין, לא
    # אמין ל"מיד ברגע X". ראה הדיון בפרויקט לגבי חישוב תקציב הדקות.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # הפעלה ידנית - גם לבדיקות וגם לתגובה מיידית לפקודה

concurrency:
  group: job-alert-check
  cancel-in-progress: false   # לא מבטלים ריצה באמצע כתיבת state - עדיף שהחדשה תחכה

permissions:
  contents: write   # דרוש כדי ל-commit את state/ בחזרה לרפו

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # הגנה שנייה על לולאות שלא נעצרות - לא סומכים רק על MAX_PAGES בקוד

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (chromium only)
        run: python -m playwright install --with-deps chromium

      - name: Run check
        working-directory: src
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Commit updated state
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ profiles/
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push
